name: Playwright Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      test_marker:
        description: 'Test marker to run (e.g., smoke, regression, sanity)'
        required: false
        default: 'smoke'
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Create .env file from secrets
      run: |
        echo "USERNAME=${{ secrets.USERNAME }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env

    - name: Run tests
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          pytest tests/ -vsm "${{ inputs.test_marker }}" --html=pytest-report.html --self-contained-html --junitxml=pytest-results.xml
        else
          pytest tests/ -vsm smoke --html=pytest-report.html --self-contained-html --junitxml=pytest-results.xml
        fi
      continue-on-error: true

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Pytest Results
        path: pytest-results.xml
        reporter: java-junit
        fail-on-error: false

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Parse JUnit XML for stats
        TOTAL=$(grep -o 'tests="[0-9]*"' pytest-results.xml | head -1 | grep -o '[0-9]*')
        FAILURES=$(grep -o 'failures="[0-9]*"' pytest-results.xml | head -1 | grep -o '[0-9]*')
        ERRORS=$(grep -o 'errors="[0-9]*"' pytest-results.xml | head -1 | grep -o '[0-9]*')
        SKIPPED=$(grep -o 'skipped="[0-9]*"' pytest-results.xml | head -1 | grep -o '[0-9]*')
        PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

        echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count | Percentage |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|------------|" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ **Passed** | $PASSED | $(( PASSED * 100 / TOTAL ))% |" >> $GITHUB_STEP_SUMMARY
        echo "| ❌ **Failed** | $FAILURES | $(( FAILURES * 100 / TOTAL ))% |" >> $GITHUB_STEP_SUMMARY
        echo "| ⚠️ **Errors** | $ERRORS | $(( ERRORS * 100 / TOTAL ))% |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏭️ **Skipped** | $SKIPPED | $(( SKIPPED * 100 / TOTAL ))% |" >> $GITHUB_STEP_SUMMARY
        echo "| 📝 **Total** | $TOTAL | 100% |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Visual progress bar
        PASSED_BARS=$((PASSED * 20 / TOTAL))
        FAILED_BARS=$((FAILURES * 20 / TOTAL))
        echo "### 📈 Visual Progress" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        printf "Passed:  ["
        for i in $(seq 1 $PASSED_BARS); do printf "█"; done
        printf "] $PASSED/$TOTAL\n"
        printf "Failed:  ["
        for i in $(seq 1 $FAILED_BARS); do printf "█"; done
        printf "] $FAILURES/$TOTAL\n"
        echo '```' >> $GITHUB_STEP_SUMMARY >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Status badge
        if [ $FAILURES -eq 0 ] && [ $ERRORS -eq 0 ]; then
          echo "### ✅ Build Status: **PASSED** 🎉" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Build Status: **FAILED** ⚠️" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: logs/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          pytest-report.html
          .pytest_cache/
        retention-days: 7
